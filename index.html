<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMW i7 Showroom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header>
    <h1>BMW i7 Interactive Showroom</h1>
    <p>Tap on doors, seats, or dashboard to explore the interior.</p>
  </header>

  <!-- ARENA (Three.js renders here) -->
  <div id="arena"></div>

  <!-- PRODUCT PANEL -->
  <section id="products">
    <h2>Featured Items</h2>
    <div class="product-card">
      <h4>Used iPhone 12 — £250</h4>
      <p>128GB • Good condition • No cracks</p>
      <a href="https://wa.me/447512345678?text=Hi%20Rumaan,%20I%20want%20the%20Used%20iPhone%2012"
         class="buy-btn" target="_blank">Buy</a>
    </div>

    <div class="product-card">
      <h4>Gaming Headset — £35</h4>
      <p>Clean • Works perfectly • RGB lights</p>
      <a href="https://wa.me/447512345678?text=Hi%20Rumaan,%20I%20want%20the%20Gaming%20Headset"
         class="buy-btn" target="_blank">Buy</a>
    </div>

    <div class="product-card">
      <h4>Bluetooth Speaker — £20</h4>
      <p>Loud • Deep bass • Portable</p>
      <a href="https://wa.me/447833914552?text=Hi%20Rumaan,%20I%20want%20the%20Bluetooth%20Speaker"
         class="buy-btn" target="_blank">Buy</a>
    </div>
  </section>

  <!-- Load Three.js Showroom Script -->
  <script type="module" src="game.js"></script>
</body>
</html>
